<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akshat Bhardwaj — Portfolio</title>
    <meta name="description" content="An interactive portfolio showcasing Akshat Bhardwaj’s software, full-stack, and AI work through immersive motion, project highlights, and collaboration links." />
    <!-- Indexing stays disabled until launch is authorized (see also public/robots.txt). -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonts: the @import in src/index.css is dropped by the Vite/Tailwind CSS pipeline (it ends up
         after other rules), so the same Google Fonts URL is loaded here. index.css is left untouched. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono&display=swap" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Akshat Bhardwaj — Portfolio" />
    <meta property="og:description" content="An interactive portfolio showcasing Akshat Bhardwaj’s software, full-stack, and AI work through immersive motion, project highlights, and collaboration links." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
